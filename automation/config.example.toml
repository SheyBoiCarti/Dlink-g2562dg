# Copying this template alone is not setup. dlink-ssh setup writes an owner ID
# and stores secrets in Windows Credential Manager, never here.
host = "10.0.0.2"
trusted_network = "10.0.0.0/24"
local_address = "10.0.0.10" # Set to the PC's Ethernet address, not the router.
telnet_user = "root"
owner = "" # Generated by setup; do not copy an installation between controllers.
host_fingerprint = "" # Independently verify; do not accept a network scan alone.
private_key = 'C:\Users\YOUR_USER\AppData\Local\DLinkSSHRestore\id_rsa'
public_key = 'C:\Users\YOUR_USER\AppData\Local\DLinkSSHRestore\id_rsa.pub'
timeout = 15
min_ram_kib = 16384
attempts = 5
backoff_seconds = 15
monitor_seconds = 120
